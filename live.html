<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M TECH INC LIVE</title>
<meta name="version" content="000.5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Bebas+Neue&family=Lexend:wght@500;700&family=Montserrat:wght@500;800&family=Oswald:wght@500;600&family=Playfair+Display:wght@500;700&family=Poppins:wght@500;700&display=swap">
<style>
:root{--fg:#fff;--accent:#23c3e7;--on-accent:#06202a;--bg:rgba(11,26,45,.86);--bg-top:rgba(31,46,64,.86);--fullbg:rgba(0,0,0,0);
  --font:"Barlow Semi Condensed";--wt:700;--x:50vw;--y:93.5vh;--w:84vw;--size:1;--cut:calc(1.5vh*var(--size));--round:calc(1.3vh*var(--size))}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
body.debug{background:#1b2738 linear-gradient(160deg,#3d4f66 0%,#1b2738 55%,#0e151f 100%)}
#fullbg{position:fixed;inset:0;background:var(--fullbg);transition:background-color .4s ease}

/* The graphic. Anchored at (x, y): left/centre/right edge horizontally, bottom/middle/top edge vertically. */
#gfx{position:fixed;left:var(--x);top:var(--y);width:var(--w);--tx:-50%;--ty:-100%;transform:translate(var(--tx),var(--ty));
  display:flex;flex-direction:column;align-items:center;font-family:var(--font),"Segoe UI",system-ui,sans-serif;font-weight:var(--wt);color:var(--fg);
  transition:left .3s ease,top .3s ease,width .3s ease}
#gfx.al-left{--tx:0%;align-items:flex-start}
#gfx.al-right{--tx:-100%;align-items:flex-end}
#gfx.pos-top{--ty:0%}
#gfx.pos-middle{--ty:-50%}
#gfx.L-box{width:max-content;max-width:var(--w)}
#gfx.L-full{left:50vw;top:50vh;--tx:-50%;--ty:-50%}

/* Song tag: sits on the top edge of the bar */
#tag{display:flex;align-items:baseline;max-width:100%;font-size:calc(1.75vh*var(--size));line-height:1;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
  padding:.6em 1.15em .55em .95em;background:var(--accent);color:var(--on-accent);opacity:0;transform:translateY(.45em);
  transition:opacity .22s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
#tag .t{font-weight:var(--wt);overflow:hidden;text-overflow:ellipsis}
#tag .a{font-weight:500;opacity:.8;margin-left:.8em;overflow:hidden;text-overflow:ellipsis}
#tag .a:empty{display:none}
#gfx.c-angled #tag{clip-path:polygon(0 0,100% 0,calc(100% - .7em) 100%,0 100%)}
#gfx.c-angled.al-right #tag{clip-path:polygon(0 0,100% 0,100% 100%,.7em 100%);padding:.6em .95em .55em 1.15em}
#gfx.c-angled.al-left #tag{margin-left:var(--cut)}
#gfx.c-angled.al-right #tag{margin-right:var(--cut)}
#gfx.c-rounded #tag{border-radius:.45em .45em 0 0}
#gfx.c-rounded.al-left #tag{margin-left:var(--round)}
#gfx.c-rounded.al-right #tag{margin-right:var(--round)}
#gfx.on.has-tag #tag{opacity:1;transform:none;transition-delay:.4s}
#gfx.on.has-tag #tag.swap{opacity:0;transform:none;transition-delay:0s}
#gfx.lbl-none #tag{display:none}
#gfx.L-sub #tag,#gfx.L-full #tag{background:none;color:var(--accent);padding:0 0 .75em;clip-path:none;margin-left:0;margin-right:0;border-radius:0;text-shadow:0 .08em .35em rgba(0,0,0,.75)}
#gfx.L-full #tag{font-size:calc(2.3vh*var(--size))}

/* Bar */
#panel{position:relative;width:100%}
#gfx.L-box #panel{width:auto}
#rule{position:absolute;left:0;right:0;top:0;height:max(3px,calc(.42vh*var(--size)));background:var(--accent);z-index:2;
  transform:scaleX(0);transition:transform .32s cubic-bezier(.7,0,.3,1) .26s}
#gfx.al-left #rule{transform-origin:left center}
#gfx.al-right #rule{transform-origin:right center}
#gfx.on #rule{transform:scaleX(1);transition:transform .38s cubic-bezier(.2,.8,.2,1) 0s}
#gfx.c-angled #rule{left:var(--cut);right:var(--cut)}
#gfx.c-rounded #rule{left:var(--round);right:var(--round)}
#body{position:relative;padding:calc(1.7vh*var(--size)) calc(3.2vh*var(--size));clip-path:inset(0 50% 0 50%);
  transition:clip-path .34s cubic-bezier(.7,0,.3,1) .1s}
#gfx.al-left #body{clip-path:inset(0 100% 0 0)}
#gfx.al-right #body{clip-path:inset(0 0 0 100%)}
#gfx.on #body{clip-path:inset(0 0 0 0);transition:clip-path .5s cubic-bezier(.2,.8,.2,1) .14s}
#shape{position:absolute;inset:0;background:linear-gradient(180deg,var(--bg-top),var(--bg))}
#gfx.c-angled #shape{clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut))}
#gfx.c-rounded #shape{border-radius:var(--round)}
#gfx.L-sub #rule,#gfx.L-full #rule,#gfx.L-sub #shape,#gfx.L-full #shape{display:none}
#gfx.L-sub #body,#gfx.L-full #body{padding:0;clip-path:none;opacity:0;transition:opacity .35s ease .05s}
#gfx.L-sub.on #body,#gfx.L-full.on #body{opacity:1}

/* Lyrics: two layers so one line can leave while the next arrives */
#text{position:relative;transition:height .3s cubic-bezier(.2,.8,.2,1)}
.layer{position:absolute;left:0;right:0;top:0;white-space:pre-wrap;overflow-wrap:break-word;line-height:1.14;text-align:center;
  opacity:0;transform:translateY(.35em);transition:opacity .28s ease,transform .34s cubic-bezier(.2,.8,.2,1)}
.layer.active{opacity:1;transform:none}
.layer.out{opacity:0;transform:translateY(-.3em);transition-duration:.16s,.2s;transition-delay:0s !important}
#gfx.al-left .layer{text-align:left}
#gfx.al-right .layer{text-align:right}
#gfx.upper .layer{text-transform:uppercase}
#gfx.L-bar .layer,#gfx.L-box .layer{text-shadow:var(--tshadow,0 .04em .14em rgba(0,0,0,.28))}
#gfx.L-sub .layer{text-shadow:-.06em 0 #000,.06em 0 #000,0 -.06em #000,0 .06em #000,-.045em -.045em #000,.045em -.045em #000,-.045em .045em #000,.045em .045em #000,0 .1em .35em rgba(0,0,0,.65)}
#gfx.L-full .layer{text-shadow:0 .05em .25em rgba(0,0,0,.55)}
/* Second language under the lyric ("Both"): smaller, in the accent colour */
.layer .l2,#probe .l2{display:block;font-size:.72em;font-weight:500;font-style:italic;line-height:1.18;margin-top:.4em}
.layer .l2{color:var(--accent)}

/* Animation choices */
#gfx.an-fade #body{clip-path:none !important;opacity:0;transition:opacity .35s ease .05s}
#gfx.an-fade.on #body{opacity:1}
#gfx.an-fade #rule{transform:none;opacity:0;transition:opacity .35s ease}
#gfx.an-fade.on #rule{opacity:1}
#gfx.an-cut,#gfx.an-cut *,#gfx.dragging,#gfx.dragging *{transition:none !important}

#probe{position:absolute;left:-10000px;top:0;visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word;line-height:1.14;font-family:var(--font),"Segoe UI",system-ui,sans-serif;font-weight:var(--wt)}
#dbg{display:none;position:fixed;left:10px;top:10px;font:12px/1.55 ui-monospace,Consolas,monospace;color:#cfe3f5;background:rgba(0,0,0,.7);border:1px solid #23c3e7;border-radius:8px;padding:8px 11px;white-space:pre}
body.debug #dbg{display:block}
#warn{display:none;position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);max-width:90vw;font:700 max(14px,2.4vh)/1.35 system-ui,"Segoe UI",sans-serif;color:#ffcf5c;background:rgba(0,0,0,.75);border:2px solid #ffb300;border-radius:10px;padding:12px 18px;text-align:center}
</style>
</head>
<body>
<div id="fullbg"></div>
<div id="gfx" class="L-bar pos-bottom al-center c-angled an-wipe lbl-song">
  <div id="tag"><span class="t"></span><span class="a"></span></div>
  <div id="panel">
    <div id="rule"></div>
    <div id="body">
      <div id="shape"></div>
      <div id="text"><div class="layer"></div><div class="layer"></div></div>
    </div>
  </div>
</div>
<div id="probe"></div>
<div id="warn">This OBS / vMix link is incomplete (no room code).<br>Copy “YOUR OBS / vMix LINK” from the controller again.</div>
<div id="dbg"></div>
<script>
/* ── M TECH INC live link — shared by index.html (controller) and live.html (OBS/vMix output) ──
   Every controller (each browser) gets its own private room, so every user has their own OBS link
   (…/live.html?room=…). Lyrics travel over two free public MQTT brokers at once (EMQX, Eclipse);
   ntfy.sh is a backup used only when no output is reachable over MQTT. Anyone who has a room's link
   can send to it — NEW LINK in the controller replaces a link that was shared by mistake. */
var MT = (function () {
  var CFG = Object.assign({
    home: 'https://ndumbestedrielnmbuaaws.github.io/M-TECH-INC-LYRICS/', // where the two pages are hosted (top of the repo)
    brokers: [
      { name: 'EMQX', url: 'wss://broker.emqx.io:8084/mqtt' },
      { name: 'Eclipse', url: 'wss://mqtt.eclipseprojects.io:443/mqtt' }
    ],
    ntfy: 'https://ntfy.sh',
    translateEmail: '', // optional contact email for MyMemory: raises its free limit from 5,000 to 50,000 characters a day
    maxAgeMs: 6 * 60 * 60 * 1000 // ignore a lyric left on air more than 6 hours ago
  }, window.MTECH_CONFIG || {});

  function cleanRoom(r) { return String(r || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40); }
  // The room comes from the link (?room=…) or, on the controller, from this browser's saved room.
  var ROOM = cleanRoom(new URLSearchParams(location.search).get('room')) || cleanRoom(window.MTECH_ROOM);
  var KEEPALIVE = 60; // seconds
  var enc = new TextEncoder(), dec = new TextDecoder();

  function str(s) { var b = enc.encode(s), out = [b.length >> 8, b.length & 255]; for (var i = 0; i < b.length; i++) out.push(b[i]); return out; }
  function packet(head, body) {
    var len = [], n = body.length;
    do { var d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; len.push(d); } while (n > 0);
    var out = new Uint8Array(1 + len.length + body.length);
    out[0] = head; out.set(len, 1); out.set(body, 1 + len.length);
    return out;
  }

  /* Minimal MQTT 3.1.1 client over WebSocket: QoS 0, retained publish, auto-reconnect. */
  function Mqtt(broker, opts) {
    this.name = broker.name; this.url = broker.url; this.opts = opts || {};
    this.state = 'connecting'; this.ws = null; this.buf = new Uint8Array(0);
    this.backoff = 1000; this.pid = 0; this.lastRx = 0; this.pending = false;
    this.clientId = 'mt' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-4);
    this.connect();
  }
  Mqtt.prototype.setState = function (s) {
    if (this.state === s) return;
    this.state = s;
    if (this.opts.onState) this.opts.onState(this);
  };
  Mqtt.prototype.connect = function () {
    var self = this, ws;
    clearTimeout(this.retryT);
    this.setState('connecting');
    try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.retry(); return; }
    this.ws = ws; ws.binaryType = 'arraybuffer'; this.buf = new Uint8Array(0);
    var giveUp = setTimeout(function () { if (self.ws === ws && self.state !== 'up') self.kick(); }, 12000);
    ws.onopen = function () {
      self.lastRx = Date.now();
      self.send(packet(0x10, str('MQTT').concat([4, 2, KEEPALIVE >> 8, KEEPALIVE & 255], str(self.clientId))));
    };
    ws.onmessage = function (ev) {
      if (self.ws !== ws || !(ev.data instanceof ArrayBuffer)) return;
      self.lastRx = Date.now();
      self.feed(new Uint8Array(ev.data));
    };
    ws.onerror = function () {};
    ws.onclose = function () {
      clearTimeout(giveUp);
      if (self.ws !== ws) return;
      self.ws = null; clearInterval(self.pingT);
      self.setState('down');
      self.retry();
    };
  };
  Mqtt.prototype.retry = function () {
    var self = this, wait = this.backoff + Math.floor(Math.random() * 400);
    this.backoff = Math.min(this.backoff * 2, 30000);
    clearTimeout(this.retryT);
    this.retryT = setTimeout(function () { self.connect(); }, wait);
  };
  Mqtt.prototype.send = function (bytes) {
    try { if (this.ws && this.ws.readyState === 1) { this.ws.send(bytes); return true; } } catch (e) {}
    return false;
  };
  Mqtt.prototype.kick = function () { try { if (this.ws) this.ws.close(); } catch (e) {} };
  Mqtt.prototype.publish = function (topic, text, retain) {
    if (this.state !== 'up') return false;
    return this.send(packet(retain ? 0x31 : 0x30, str(topic).concat(Array.from(enc.encode(text)))));
  };
  Mqtt.prototype.ping = function () {
    if (this.state !== 'up') return;
    if (Date.now() - this.lastRx > KEEPALIVE * 1500) { this.kick(); return; } // connection went silent
    this.send(new Uint8Array([0xC0, 0]));
  };
  Mqtt.prototype.feed = function (chunk) {
    var b = chunk;
    if (this.buf.length) { b = new Uint8Array(this.buf.length + chunk.length); b.set(this.buf); b.set(chunk, this.buf.length); }
    var off = 0;
    while (b.length - off >= 2) {
      var mul = 1, len = 0, i = off + 1, byte, whole = true;
      do {
        if (i >= b.length) { whole = false; break; }
        byte = b[i++]; len += (byte & 127) * mul; mul *= 128;
        if (mul > 268435456) { this.buf = new Uint8Array(0); this.kick(); return; }
      } while (byte & 128);
      if (!whole || b.length < i + len) break;
      this.handle(b[off] >> 4, b[off] & 15, b.subarray(i, i + len));
      off = i + len;
    }
    this.buf = off < b.length ? b.slice(off) : new Uint8Array(0);
  };
  Mqtt.prototype.handle = function (type, flags, body) {
    var self = this;
    if (type === 2) { // CONNACK
      if (body.length < 2 || body[1] !== 0) { this.kick(); return; }
      this.backoff = 1000;
      this.setState('up');
      var subs = this.opts.subs || [];
      if (subs.length) {
        this.pid = this.pid % 65535 + 1;
        var sb = [this.pid >> 8, this.pid & 255];
        subs.forEach(function (t) { sb = sb.concat(str(t), [0]); });
        this.send(packet(0x82, sb));
      }
      clearInterval(this.pingT);
      this.pingT = setInterval(function () { self.ping(); }, KEEPALIVE * 1000 / 3);
      if (this.opts.onUp) this.opts.onUp(this);
    } else if (type === 3) { // PUBLISH
      if (body.length < 2) return;
      var qos = (flags >> 1) & 3, p = 2 + ((body[0] << 8) | body[1]);
      if (body.length < p) return;
      var topic = dec.decode(body.subarray(2, p));
      if (qos > 0) { this.send(new Uint8Array([qos === 1 ? 0x40 : 0x50, 2, body[p], body[p + 1]])); p += 2; }
      if (this.opts.onMessage) this.opts.onMessage(this, topic, dec.decode(body.subarray(p)));
    } else if (type === 6 && body.length >= 2) { // PUBREL -> PUBCOMP
      this.send(new Uint8Array([0x70, 2, body[0], body[1]]));
    }
  };

  /* Output style: one shared description of the on-screen graphic, sent on its own retained channel. */
  var FONTS = { 'Barlow Semi Condensed': 700, 'Montserrat': 800, 'Poppins': 700, 'Lexend': 700, 'Oswald': 600, 'Bebas Neue': 400, 'Playfair Display': 700, 'System': 800 };
  var STYLE_DEFAULT = {
    layout: 'bar', corners: 'angled', pos: 'bottom', align: 'center', x: 50, y: 93.5, w: 84, size: 1,
    font: 'Barlow Semi Condensed', fg: '#ffffff', accent: '#23c3e7', bg: '#0b1a2d', bgAlpha: 0.86,
    upper: false, label: 'song', labelText: '', anim: 'wipe'
  };
  function cleanStyle(s) {
    s = s && typeof s === 'object' ? s : {};
    var d = STYLE_DEFAULT, o = {};
    function pick(k, list) { o[k] = list.indexOf(s[k]) > -1 ? s[k] : d[k]; }
    function num(k, lo, hi) { var v = parseFloat(s[k]); o[k] = isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d[k]; }
    function col(k) { o[k] = /^#[0-9a-fA-F]{6}$/.test(s[k] || '') ? String(s[k]).toLowerCase() : d[k]; }
    pick('layout', ['bar', 'box', 'sub', 'full']); pick('corners', ['angled', 'square', 'rounded']);
    pick('pos', ['bottom', 'middle', 'top']); pick('align', ['left', 'center', 'right']);
    num('x', 0, 100); num('y', 0, 100); num('w', 20, 100); num('size', 0.4, 2.5);
    o.font = Object.prototype.hasOwnProperty.call(FONTS, s.font) ? s.font : d.font;
    col('fg'); col('accent'); col('bg'); num('bgAlpha', 0, 1);
    o.upper = s.upper === true;
    pick('label', ['song', 'custom', 'none']); o.labelText = String(s.labelText || '').slice(0, 80);
    pick('anim', ['wipe', 'fade', 'cut']);
    return o;
  }

  function parseLyric(raw) {
    try {
      var m = JSON.parse(raw);
      if (m && typeof m.seq === 'number' && typeof m.text === 'string')
        return { seq: m.seq, text: m.text, sub: typeof m.sub === 'string' ? m.sub.slice(0, 4000) : '', // sub = translation shown under the lyric
          title: typeof m.title === 'string' ? m.title.slice(0, 120) : '', artist: typeof m.artist === 'string' ? m.artist.slice(0, 120) : '' };
    } catch (e) {}
    return null;
  }
  function parseStyle(raw) {
    try { var m = JSON.parse(raw); if (m && typeof m.seq === 'number' && m.style && typeof m.style === 'object') return { seq: m.seq, style: cleanStyle(m.style) }; } catch (e) {}
    return null;
  }

  var NTFY = String(CFG.ntfy).replace(/\/+$/, '');
  return {
    VERSION: '000.5',
    CFG: CFG, ROOM: ROOM, cleanRoom: cleanRoom, Mqtt: Mqtt,
    FONTS: FONTS, STYLE_DEFAULT: STYLE_DEFAULT, cleanStyle: cleanStyle, parseLyric: parseLyric, parseStyle: parseStyle,
    T_LIVE: 'mtech-inc/lyrics/' + ROOM + '/live',
    T_STYLE: 'mtech-inc/lyrics/' + ROOM + '/style',
    T_PRES: 'mtech-inc/lyrics/' + ROOM + '/presence',
    NTFY: NTFY, N_LIVE: 'mtech-inc-' + ROOM, N_STYLE: 'mtech-inc-' + ROOM + '-s',
    NTFY_URL: NTFY + '/mtech-inc-' + ROOM, NTFY_STYLE_URL: NTFY + '/mtech-inc-' + ROOM + '-s',
    fresh: function (m) { return Date.now() - m.seq <= CFG.maxAgeMs; }
  };
})();

(function () {
  var qs = new URLSearchParams(location.search);
  var DEBUG = qs.get('debug') === '1', EMBED = qs.get('embed') === '1';
  if (DEBUG) document.body.classList.add('debug');
  function $(id) { return document.getElementById(id); }
  var root = document.documentElement.style;
  var gfx = $('gfx'), tag = $('tag'), tagT = tag.querySelector('.t'), tagA = tag.querySelector('.a'), textEl = $('text'), panel = $('panel'), probe = $('probe');
  var layers = Array.prototype.slice.call(document.querySelectorAll('.layer')), act = 0, isOn = false, hasTag = false, dragging = false;
  var style = MT.cleanStyle({}), cur = { text: '', sub: '', title: '', artist: '' }, tagKey = '|', tagTimer = 0;
  // Lyric line(s) plus an optional translation underneath; dir=auto keeps Arabic/Hebrew right-to-left.
  function fill(node, l) {
    node.textContent = '';
    var a = document.createElement('span'); a.className = 'l1'; a.dir = 'auto'; a.textContent = l.text || ' '; node.appendChild(a);
    if (l.sub) { var b = document.createElement('span'); b.className = 'l2'; b.dir = 'auto'; b.textContent = l.sub; node.appendChild(b); }
  }

  // ── colour helpers ──
  function rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function rgba(c, a) { if (typeof c === 'string') c = rgb(c); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function mix(h, h2, t) { var a = rgb(h), b = rgb(h2); return [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * t); }); }
  function lum(h) { var c = rgb(h).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
  // Text on the accent tag: white unless dark is clearly easier to read (broadcast tags favour white).
  function onColor(h) { var L = lum(h); return (L + 0.05) / 0.0575 >= 1.2 * 1.05 / (L + 0.05) ? '#06202a' : '#ffffff'; }

  // ── style ──
  function setClasses() {
    gfx.className = ['L-' + style.layout, 'pos-' + style.pos, 'al-' + style.align, 'c-' + style.corners, 'an-' + style.anim, 'lbl-' + style.label,
      style.upper ? 'upper' : '', isOn ? 'on' : '', hasTag ? 'has-tag' : '', dragging ? 'dragging' : ''].join(' ');
  }
  function applyStyle(s, drag) {
    style = MT.cleanStyle(s);
    dragging = !!drag;
    root.setProperty('--fg', style.fg);
    root.setProperty('--accent', style.accent);
    root.setProperty('--on-accent', onColor(style.accent));
    root.setProperty('--bg', rgba(style.bg, style.bgAlpha));
    root.setProperty('--bg-top', rgba(mix(style.bg, '#ffffff', 0.07), style.bgAlpha));
    root.setProperty('--fullbg', style.layout === 'full' ? rgba(style.bg, style.bgAlpha) : 'rgba(0,0,0,0)');
    root.setProperty('--tshadow', lum(style.bg) > 0.45 && style.bgAlpha > 0.4 ? 'none' : '0 .04em .14em rgba(0,0,0,.28)'); // no dark halo on light bars
    root.setProperty('--font', style.font === 'System' ? '"Segoe UI"' : '"' + style.font + '"');
    root.setProperty('--wt', MT.FONTS[style.font]);
    root.setProperty('--x', style.x + 'vw'); root.setProperty('--y', style.y + 'vh'); root.setProperty('--w', style.w + 'vw');
    root.setProperty('--size', style.size);
    probe.style.textTransform = style.upper ? 'uppercase' : 'none';
    setClasses();
    setTag(labelFor(cur));
    relayout();
    if (document.fonts && document.fonts.load && style.font !== 'System')
      document.fonts.load(MT.FONTS[style.font] + ' 40px "' + style.font + '"').then(relayout, function () {});
  }

  // ── sizing: the text always fits the space between the graphic's anchor and the screen edge ──
  function H() { return innerHeight; }
  function padX() { return style.layout === 'bar' || style.layout === 'box' ? H() * 0.032 * style.size : 0; }
  function padY() { return style.layout === 'bar' || style.layout === 'box' ? H() * 0.017 * style.size : 0; }
  function basePx() { return H() * ({ bar: 0.046, box: 0.044, sub: 0.048, full: 0.072 })[style.layout] * style.size; }
  function textWidth() { return Math.max(60, innerWidth * style.w / 100 - 2 * padX()); }
  function maxTextH() {
    if (style.layout === 'full') return H() * 0.8;
    var y = style.y / 100 * H(), room = style.pos === 'bottom' ? y : style.pos === 'top' ? H() - y : 2 * Math.min(y, H() - y);
    room -= (style.label === 'none' ? 0 : H() * 0.045 * style.size) + 2 * padY() + H() * 0.015;
    return Math.max(H() * 0.07, Math.min(room, H() * 0.34 * style.size));
  }
  function fit(l) {
    var W = textWidth(), maxH = maxTextH(), base = basePx(), box = style.layout === 'box';
    probe.style.width = box ? 'max-content' : W + 'px';
    probe.style.maxWidth = W + 'px';
    fill(probe, l);
    function ok(fs) { probe.style.fontSize = fs + 'px'; return probe.offsetHeight <= maxH + 0.5 && probe.scrollWidth <= W + 1; }
    var fs = base;
    if (!ok(fs)) { var lo = base * 0.1, hi = base; for (var i = 0; i < 16; i++) { var mid = (lo + hi) / 2; if (ok(mid)) lo = mid; else hi = mid; } fs = lo; } // shrink rather than run off screen
    probe.style.fontSize = fs + 'px';
    var r = probe.getBoundingClientRect(); // fractional size: a rounded-down width would re-wrap the words onto an extra line
    return { fs: fs, w: Math.min(W, Math.ceil(r.width) + 1), h: Math.ceil(r.height) };
  }
  function setBox(m, instant) {
    if (instant) { textEl.style.transition = 'none'; panel.style.transition = 'none'; }
    textEl.style.height = m.h + 'px';
    panel.style.width = style.layout === 'box' ? (m.w + 2 * padX()) + 'px' : '';
    if (instant) { void textEl.offsetWidth; textEl.style.transition = ''; panel.style.transition = ''; }
  }
  function relayout() {
    if (!cur.text) { report(); return; }
    var m = fit(cur);
    layers[act].style.fontSize = m.fs + 'px';
    setBox(m, false);
    report();
  }

  // ── lyrics ──
  function swapText(l, fromOff) {
    var inc = layers[1 - act], out = layers[act];
    out.classList.remove('active'); out.classList.add('out');
    if (!l.text) return;
    var m = fit(l);
    inc.className = 'layer';
    inc.style.transition = 'none';
    inc.style.fontSize = m.fs + 'px';
    fill(inc, l);
    void inc.offsetWidth;
    inc.style.transition = '';
    inc.style.transitionDelay = fromOff && style.anim !== 'cut' ? '.32s' : '.05s';
    inc.classList.add('active');
    act = 1 - act;
    setBox(m, fromOff);
  }
  function labelFor(l) {
    if (style.label === 'song') return { t: l.title || '', a: l.artist || '' };
    if (style.label === 'custom') return { t: style.labelText, a: '' };
    return { t: '', a: '' };
  }
  function setTag(lb) {
    var key = lb.t + '|' + lb.a;
    if (key === tagKey) return;
    tagKey = key;
    var has = !!(lb.t || lb.a);
    clearTimeout(tagTimer);
    if (!isOn || !hasTag || style.anim === 'cut') {
      tagT.textContent = lb.t; tagA.textContent = lb.a; hasTag = has; tag.classList.remove('swap'); setClasses(); return;
    }
    tag.classList.add('swap');
    tagTimer = setTimeout(function () { tagT.textContent = lb.t; tagA.textContent = lb.a; hasTag = has; setClasses(); tag.classList.remove('swap'); report(); }, 220);
  }
  function showLyric(l) {
    var text = String(l.text || ''), sub = text ? String(l.sub || '') : '', changed = text !== cur.text || sub !== cur.sub;
    cur = { text: text, sub: sub, title: String(l.title || ''), artist: String(l.artist || '') };
    setTag(labelFor(cur));
    if (changed) {
      var fromOff = !isOn;
      swapText(cur, fromOff);
      isOn = !!text;
      setClasses();
    }
    gfx.setAttribute('data-text', text);
    gfx.setAttribute('data-sub', sub);
    report();
  }

  // ── preview inside the controller: report where the graphic is so it can be dragged ──
  var until = 0, raf = 0;
  function report() { if (!EMBED) return; until = performance.now() + 750; if (!raf) raf = requestAnimationFrame(tick); }
  function tick() {
    var r = gfx.getBoundingClientRect();
    parent.postMessage({ mt: 'rect', x: r.left, y: r.top, w: r.width, h: r.height, on: isOn }, '*');
    raf = performance.now() < until ? requestAnimationFrame(tick) : 0;
  }

  addEventListener('resize', relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout, function () {});
  applyStyle({});

  if (EMBED) {
    addEventListener('message', function (e) {
      if (e.source !== parent) return;
      var d = e.data || {};
      if (d.mt === 'style') applyStyle(d.style, d.dragging);
      else if (d.mt === 'lyric') showLyric(d.lyric || {});
    });
    parent.postMessage({ mt: 'ready' }, '*');
    return;
  }
  if (!MT.ROOM) { $('warn').style.display = 'block'; return; } // old link without ?room=

  // ── live output: receive lyrics and style from the controller ──
  var OUT_ID = 'o' + Math.random().toString(36).slice(2, 10), KIND = window.obsstudio ? 'obs' : 'web';
  var lastSeq = 0, lastStyleSeq = 0, lastVia = '', lastAt = 0, ntfyState = 'connecting', clients = [], dbg = $('dbg');

  function acceptLyric(raw, via) {
    var m = MT.parseLyric(raw);
    if (!m || m.seq <= lastSeq || !MT.fresh(m)) return;
    lastSeq = m.seq; lastVia = via; lastAt = Date.now();
    showLyric(m);
    announce();
    render();
  }
  function acceptStyle(raw) {
    var m = MT.parseStyle(raw);
    if (!m || m.seq <= lastStyleSeq) return;
    lastStyleSeq = m.seq;
    applyStyle(m.style);
    render();
  }
  function announce() {
    var p = JSON.stringify({ id: OUT_ID, kind: KIND, seq: lastSeq, v: MT.VERSION });
    clients.forEach(function (c) { c.publish(MT.T_PRES, p, false); });
  }
  function label(s) { return s === 'up' ? 'connected' : s === 'down' ? 'retrying…' : 'connecting…'; }
  function render() {
    if (!DEBUG) return;
    var lines = ['M TECH INC OUTPUT · version ' + MT.VERSION + ' · test view (OBS shows only the graphic)', 'Room: ' + MT.ROOM];
    clients.forEach(function (c) { lines.push(c.name + ': ' + label(c.state)); });
    lines.push('Backup (ntfy): ' + label(ntfyState));
    lines.push(lastAt ? 'Last lyric ' + new Date(lastAt).toLocaleTimeString() + ' via ' + lastVia : 'Waiting for the controller…');
    dbg.textContent = lines.join('\n');
  }

  clients = MT.CFG.brokers.map(function (b) {
    return new MT.Mqtt(b, {
      subs: [MT.T_LIVE, MT.T_STYLE, MT.T_PRES],
      onMessage: function (c, topic, text) {
        if (topic === MT.T_LIVE) acceptLyric(text, c.name);
        else if (topic === MT.T_STYLE) acceptStyle(text);
        else if (topic === MT.T_PRES) { try { if (JSON.parse(text).q) announce(); } catch (e) {} }
      },
      onUp: function () { announce(); render(); },
      onState: render
    });
  });
  setInterval(announce, 10000);

  // Backup path: ntfy.sh (plain HTTPS). Newest lyric and style on connect, then a live stream of both.
  (function () {
    var es = null, backoff = 3000, timer = null;
    function take(line) {
      try {
        var d = JSON.parse(line);
        if (d.event !== 'message' || typeof d.message !== 'string') return;
        if (d.topic === MT.N_STYLE) acceptStyle(d.message); else acceptLyric(d.message, 'backup');
      } catch (e) {}
    }
    function fetchLast(topic, since) {
      return fetch(MT.NTFY + '/' + topic + '/json?poll=1&since=' + since, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) return false;
        return r.text().then(function (t) { var l = t.split('\n').filter(Boolean); if (l.length) take(l[l.length - 1]); return true; });
      }).catch(function () { return true; });
    }
    function poll() {
      [MT.N_STYLE, MT.N_LIVE].forEach(function (t) { fetchLast(t, 'latest').then(function (ok) { if (!ok) fetchLast(t, t === MT.N_STYLE ? '12h' : '6h'); }); });
    }
    function open() {
      ntfyState = 'connecting'; render();
      try { es = new EventSource(MT.NTFY + '/' + MT.N_LIVE + ',' + MT.N_STYLE + '/sse'); } catch (e) { later(); return; }
      es.onopen = function () { backoff = 3000; ntfyState = 'up'; render(); poll(); };
      es.onmessage = function (ev) { take(ev.data); };
      es.onerror = function () { try { es.close(); } catch (e) {} ntfyState = 'down'; render(); later(); };
    }
    function later() { clearTimeout(timer); timer = setTimeout(open, backoff); backoff = Math.min(backoff * 2, 120000); }
    open();
  })();
  render();
})();
</script>
</body>
</html>
